<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- ToolDock のアイコン。上にタブの帯 (選んでいるタブは紫)、その下に窓の本体。
       ICO は tools/make-icon.py でこのファイル (と icon-small.svg) から作る -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34345c"/>
      <stop offset="1" stop-color="#20203a"/>
    </linearGradient>
  </defs>
  <!-- 縁取りは暗い地 (ダークモードのタスクバー) で輪郭が消えないようにするため -->
  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#bg)" stroke="#565690" stroke-width="4"/>
  <!-- タブ -->
  <rect x="40" y="46" width="62" height="34" rx="10" fill="#7c3aed"/>
  <rect x="108" y="46" width="52" height="34" rx="10" fill="#3c3c68"/>
  <rect x="166" y="46" width="50" height="34" rx="10" fill="#3c3c68"/>
  <!-- 本体 (取り込んだ窓) -->
  <rect x="40" y="86" width="176" height="130" rx="12" fill="#e2e8f0"/>
  <rect x="58" y="108" width="100" height="12" rx="6" fill="#94a3b8"/>
  <rect x="58" y="132" width="140" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="58" y="156" width="120" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="58" y="180" width="84" height="12" rx="6" fill="#cbd5e1"/>
</svg>
