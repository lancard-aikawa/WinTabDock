# ToolDock に並べるツール。「+ 起動 / 取り込む」のメニューに出る。
# 起動中のものがあれば、2 つ目は起動せずにその窓を取り込む。

# ドックの外で起動したツール (エクスプローラーからダブルクリックなど) も、窓が出たら自動でタブにする
auto_adopt = true
# ドックを閉じたときのタブと大きさ・位置を、次に開いたときに戻す (起動中なら取り込み、なければ起動)
restore_session = true

[[tool]]
name = "LPortMan"
exe = "C:/Repos/mywork/LPortMan/dist/LPortMan/lportmanw.exe"

[[tool]]
name = "PortWho"
exe = "C:/Repos/mywork/PortWho/dist/PortWho.exe"

[[tool]]
name = "RepoTether"
exe = "C:/Repos/mywork/RepoTether/src-tauri/target/release/repotether.exe"
