# ToolDock の設定の見本。exe の隣に tooldock.toml という名前で置く (配布の zip には、これが tooldock.toml として入っている)。
# 書き換えたら ToolDock を起動し直す。

# ドックの外で起動したツール (エクスプローラーからダブルクリックなど) も、窓が出たら自動でタブにする
auto_adopt = true
# 「設定」の「起動時に開く」をまだ選んでいないときに、前回開いていたタブを開き直すか
restore_session = true

# 並べるツール。「+ 起動 / 取り込む」のメニューにこの順で出る。name は表示名、exe は実行ファイルの場所 (/ 区切りでよい)。
# 登録していない窓も「起動中の窓を取り込む」から取り込める。
#
# [[tool]]
# name = "MyTool"
# exe = "C:/Tools/MyTool/MyTool.exe"
#
# [[tool]]
# name = "OtherTool"
# exe = "C:/Tools/OtherTool/OtherTool.exe"
