# Shipnote の設定。Pages の LP (/projects/<slug>/) に出す内容。
# 書き換えたら `shipnote sync` で反映する。

name = "WinTabDock"
github = "lancard-aikawa/WinTabDock"
# slug = "wintabdock"   # LP の URL。省略すると name から作る

# 一行の紹介 (トップの一覧と LP の見出し下に出る)
tagline = "別々に起動したツールの窓を、1 つの枠にタブでまとめる Windows 用アプリ"

# 二〜四文の説明
description = "自作のツールを 1 つずつ起動していくと、タスクバーと窓が増えて散らかります。WinTabDock は、それぞれの窓の枠を外してドックの中に重ね、タブで切り替えられるようにします。相手のアプリには手を入れず、タスクバーに残るボタンはドックの 1 つだけです。ドックから外したりドックを閉じたりすると、元の窓に戻ります。"

features = [
  "相手のアプリを改造せずに取り込みます。タイトルバーを外してドックに重ね、タブで切り替えます",
  "登録したツールは、エクスプローラーから起動してもドックのタブになります (自動取り込み)。設定画面などの 2 つ目の窓やダイアログはタブにしません",
  "起動済みのツールは 2 つ目を起動せず切り替えます。登録していない窓も「起動中の窓を取り込む」から取り込めます",
  "ドックを動かす・大きさを変える・最小化すると、中のツールもついてきます。大きさと位置は次に開いたときに戻ります",
  "起動時に開くタブ、ドックを閉じるときのツールの扱い、ログイン時の起動を設定で選べます",
]

# 動く環境 (例: "Windows 10 / 11")
platforms = "Windows 10 / 11"

# リポジトリ内の画像のパス。LP に並ぶ
screenshots = ["docs/images/dock.png"]

# false にするとトップの一覧から外す (LP とリリース記録は作る)
listed = true

# false にすると一覧と LP だけ載せ、リリース記録 (/posts/) は作らない (作ってあったものは消す)
posts = true
